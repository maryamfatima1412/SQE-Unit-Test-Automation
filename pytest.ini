[pytest]
# --- where things are -------------------------------------------------------
testpaths = tests
pythonpath = src
# --- behaviour ----------------------------------------------------------------
# xfail_strict: a known-defect test that suddenly passes is reported as a failure,
# so we notice when a defect has been fixed.
xfail_strict = true
addopts = -ra --strict-markers --strict-config
# --- test groups (markers) ----------------------------------------------------
# Execution order of the groups is defined in tests/conftest.py (GROUP_ORDER).
markers =
    smoke: small set of core checks, runs first
    grading: Module 1 - grade_from_percentage / grade_color
    storage: Module 2 - Storage class (data layer)
    student_analytics: Module 3 - StudentDashboard calculations and filters
    data_driven: tests whose data comes from CSV files listed in the Excel sheet
    known_defects: tests that document real defects (expected to fail, xfail)
    boundary: boundary value analysis (BVA)
    equivalence: equivalence class partitioning (ECP)
    negative: invalid input / error handling
    state: state and persistence behaviour
    maryam: tests written by Maryam Fatima (24F-3044)
    huda: tests written by Huda Asif (24F-3111)
    execution_order(n): position of a test inside its group (lower runs first, default 100)
